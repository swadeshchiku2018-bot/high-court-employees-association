<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 15" width="38" height="15">
  <style>
    @keyframes blinkEffect {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    .blink-box {
      animation: blinkEffect 0.85s infinite ease-in-out;
    }
  </style>
  <g class="blink-box">
    <rect x="0.5" y="0.5" width="37" height="14" rx="3" fill="#dc2626" stroke="#b91c1c" stroke-width="0.8" />
    <circle cx="6.5" cy="7.5" r="2" fill="#fef08a" />
    <text x="21.5" y="10.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">NEW</text>
  </g>
</svg>
